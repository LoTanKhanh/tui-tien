<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Túi Tiền">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Túi Tiền</title>
<style>
:root{
  /* Bố cục: một cột hẹp, thanh tab dưới đáy, nút Thêm nổi ở giữa. Số tiền dùng chữ tròn của hệ thống. */
  --bg:#F1F4F2; --surface:#FFFFFF; --surface2:#E8EDEA; --line:#DAE1DD;
  --ink:#16201C; --ink2:#55645D; --ink3:#6B7A73;
  --accent:#3347E0; --accent-ink:#FFFFFF; --accent-soft:#E3E7FB;
  --pos:#17814F; --pos-soft:#DCF0E5; --neg:#CF4037; --neg-soft:#FADFDC;
  --warn:#8F6000; --warn-soft:#F8EBC8;
  --c1:#3B6FE0; --c2:#129E94; --c3:#5AA33F; --c4:#D99A0B; --c5:#E2692A;
  --c6:#D2457D; --c7:#8858D4; --c8:#A0694A; --c9:#B23A48; --c10:#6D7B8A;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1513; --surface:#18201D; --surface2:#222C28; --line:#2A3631;
    --ink:#EDF2EF; --ink2:#A5B3AC; --ink3:#87958E;
    --accent:#8A99FF; --accent-ink:#0B1033; --accent-soft:#242B57;
    --pos:#4CC58A; --pos-soft:#173626; --neg:#F0716A; --neg-soft:#40201E;
    --warn:#E5B34A; --warn-soft:#3A2F12;
    --c1:#6C93F2; --c2:#35C2B7; --c3:#7FC663; --c4:#F0B93A; --c5:#F28A52;
    --c6:#EA6C9F; --c7:#A98AEA; --c8:#C99273; --c9:#E06A78; --c10:#98A5B2;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:520px;margin:0 auto;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--ink2)} .small{font-size:13px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;min-height:40px}
.brand{font-size:21px;font-weight:700;letter-spacing:-.02em}
.h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.h{font-size:15px;font-weight:700;margin-bottom:10px}
.ibtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.ibtn:disabled{opacity:.35}
.dot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--neg);border:2px solid var(--surface)}
.mbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.mlabel{font-weight:700;font-size:16px}
.ic{display:block;flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card.flat{background:var(--surface2);border-color:transparent;margin-bottom:0}
.hero .lbl,.lbl{color:var(--ink2);font-size:13px}
.hero .big{font-size:36px;font-weight:700;line-height:1.1;margin:4px 0 14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split>div{background:var(--surface2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.split b{font-size:16px;overflow-wrap:anywhere}

.banner{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:600;margin-bottom:12px}
.banner.bad{background:var(--neg-soft);color:var(--neg)}
.banner .btn{flex:none}

.btn{appearance:none;border:0;border-radius:14px;padding:12px 16px;font-weight:600;background:var(--surface2);color:var(--ink);text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.btn.big{width:100%;padding:15px;font-size:17px;border-radius:16px}
.btn.block{width:100%}
.btn:active{filter:brightness(.94)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.stack>.seg{margin-bottom:0}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 4px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg button.on.out{color:var(--neg)} .seg button.on.in{color:var(--pos)} .seg button.on.tf{color:var(--accent)}

.fi{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;min-height:46px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.field{position:relative}
.field .fi{padding-right:34px}
.suffix{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink2)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.meta2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chkrow{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}
.chkrow input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.hint{font-size:13px;color:var(--ink2)}

.cico{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;flex:none;color:var(--cc,var(--ink2));background:var(--surface2);background:color-mix(in srgb,var(--cc,var(--ink2)) 16%,var(--surface))}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;border-radius:14px;border:1.5px solid transparent;background:var(--surface);font-size:11.5px;line-height:1.2;text-align:center;color:var(--ink2);overflow-wrap:anywhere}
.cat.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.cat .cico{width:34px;height:34px}
.amt{display:flex;align-items:baseline;justify-content:center;gap:4px;font-size:46px;font-weight:700;line-height:1.1;padding:2px 0;overflow-wrap:anywhere}
.amt small{font-size:22px;font-weight:600;color:var(--ink2)}
.amt.in{color:var(--pos)} .amt.tf{color:var(--accent)} .amt.zero{color:var(--ink3)}
.meta{display:grid;grid-template-columns:150px 1fr;gap:8px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font:600 22px ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;display:grid;place-items:center}
.pad button:active{background:var(--surface2)}

.dchart{position:relative;width:150px;height:150px;margin:2px auto 14px}
.donut{width:150px;height:150px;transform:rotate(-90deg)}
.ring,.arc{fill:none;stroke-width:16}
.ring{stroke:var(--surface2)}
.dcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px}
.dcenter b{font-size:13px;overflow-wrap:anywhere;line-height:1.2}
.legend button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 0;text-align:left;border-top:1px solid var(--line)}
.legend li:first-child button{border-top:0}
.sw{width:10px;height:10px;border-radius:3px;flex:none}

.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.warn>i{background:var(--warn)} .bar.over>i{background:var(--neg)} .bar.good>i{background:var(--pos)}
.st{font-size:13px;font-weight:600;color:var(--ink2)} .st.warn{color:var(--warn)} .st.over{color:var(--neg)} .st.good{color:var(--pos)}
.brow{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-weight:600}
.brow+.bar{margin-bottom:12px}

.list{padding:4px 12px}
.txr{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 0;text-align:left;border-top:1px solid var(--line)}
.list>.txr:first-child{border-top:0}
.txr.static{cursor:default}
.tx{display:flex;flex-direction:column}
.tx b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{color:var(--ink2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt-in{color:var(--pos);font-weight:700;white-space:nowrap} .amt-out{font-weight:700;white-space:nowrap} .amt-tf{color:var(--accent);font-weight:700;white-space:nowrap}
.dgroup{margin-bottom:6px}
.dh{display:flex;justify-content:space-between;padding:6px 4px;color:var(--ink2);font-size:13px;font-weight:600}
.sumline{margin:10px 2px 8px;color:var(--ink2);font-size:14px}
.empty{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--ink2)}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.ghead .h{margin:0}

.brow2{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:10px 0;text-align:left;border-top:1px solid var(--line)}
.ghead+.brow2{border-top:0}
.brow2 .r1{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
.brow2 .r1 b{font-weight:600}
.chk{display:flex;justify-content:space-between;gap:10px;padding:4px 0 4px 50px;font-size:13.5px}

.pick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pk{aspect-ratio:1;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink2);padding:0}
.pk.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.cl{aspect-ratio:1;border-radius:50%;border:2px solid transparent;padding:0;background:var(--cc)}
.cl.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.cat.add{border:1.5px dashed var(--line);background:transparent}
.dcard.done{opacity:.72}
.dhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.dhead h3{font-size:17px}
.dnum{margin:2px 0 10px}
.big2{font-size:28px;font-weight:700}
.facts{margin:10px 0 12px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink2)}
.facts .ok{color:var(--pos);font-weight:600} .facts .warn{color:var(--warn);font-weight:600} .facts .bad{color:var(--neg);font-weight:600}

#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--ink3)}
.tab.on{color:var(--accent)}
.tab .plus{width:50px;height:50px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-22px;box-shadow:0 4px 14px rgba(51,71,224,.35)}
.tab.add{color:var(--ink2)} .tab.add.on{color:var(--accent)}

.ov{position:fixed;inset:0;background:rgba(10,15,13,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:90vh;max-height:90dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;display:flex;flex-direction:column;gap:12px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shead h2{font-size:19px}
.sheet hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.sheet h3{font-size:15px}
textarea.fi{min-height:84px;resize:vertical}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);z-index:60;
  background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:14px;display:flex;gap:14px;align-items:center;
  font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:none;font-weight:700;text-decoration:underline;color:inherit;padding:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    if(PROT[c.id]&&c.t!==(c.id==='in_other'?'in':'out')) return;

      g:c.t==='out'?((c.id==='debt'||c.g==='fixed')?'fixed':'vari'):''});
  });
  if(!cats.length){
    DEF_CATS.forEach(function(c){
      seenC[c.id]=1;
      var g=c.t==='out'?(c.id==='debt'?'fixed':((legacyG[c.id]==='fixed'||legacyG[c.id]==='vari')?legacyG[c.id]:c.g)):'';
      cats.push({id:c.id,n:c.n,t:c.t,i:c.i,c:c.c,g:g});

    });
  }
  var baseOv={};
  if(d.baseOv&&typeof d.baseOv==='object'){

  Object.keys(budgets).forEach(function(k){if(k.indexOf('fund:')!==0&&cidT[k]!=='out') delete budgets[k];});
  return {v:2,accounts:accounts,tx:tx,debts:debts,budgets:budgets,cats:cats,baseOv:baseOv,budStart:/^\d{4}-\d{2}-\d{2}$/.test(d.budStart||'')?d.budStart:'',rec:rec,
    lastAcc:ids[d.lastAcc]?d.lastAcc:'',lastBackup:+d.lastBackup||0,created:+d.created||Date.now()};

/* ================= Tính toán ================= */
function accOf(id){return db.accounts.find(function(a){return a.id===id;});}
function monthTx(mk){return db.tx.filter(function(t){return t.date.slice(0,7)===mk;});}
function sums(mk){
  var inc=0,out=0,byCat={};
  monthTx(mk).forEach(function(t){
    if(t.type==='in') inc+=t.amount;
    else if(t.type==='out'){out+=t.amount; byCat[t.cat]=(byCat[t.cat]||0)+t.amount;}
  });
  return {inc:inc,out:out,byCat:byCat};
}
/* Dòng tiền ròng vào tài khoản, chỉ tính giao dịch trước ngày "before" (nếu có) */
function flow(accId,before){
  var n=0;
  db.tx.forEach(function(t){
    if(before&&t.date>=before) return;
    if(t.type==='in'&&t.acc===accId) n+=t.amount;
    else if(t.type==='out'&&t.acc===accId) n-=t.amount;
    else if(t.type==='tf'){ if(t.acc===accId) n-=t.amount; if(t.to===accId) n+=t.amount; }
  });
  return n;
}
/* Số dư (tài khoản thường) hoặc dư nợ (thẻ, trả sau) */
function accVal(a,before){var f=flow(a.id,before); return isLiab(a)?a.open-f:a.open+f;}
function totals(before){
  var have=0,fund=0,owed=0;
  db.accounts.forEach(function(a){
    var v=accVal(a,before);
    if(a.kind==='fund') fund+=v; else if(isLiab(a)) owed+=v; else have+=v;
  });
  return {have:have,fund:fund,owed:owed};
}
function debtInfo(d){
  var paid=(+d.prepaid||0);
  db.tx.forEach(function(t){if(t.debtId===d.id) paid+=t.amount;});
  var remain=Math.max(0,d.total-paid);
  return {paid:paid,remain:remain,pct:d.total>0?Math.min(100,paid/d.total*100):0,done:remain<=0};
}
function loanRemain(){return db.debts.reduce(function(s,d){return s+debtInfo(d).remain;},0);}
function debtPaidInMonth(id,mk){
  var s=0; db.tx.forEach(function(t){if(t.debtId===id&&t.date.slice(0,7)===mk) s+=t.amount;}); return s;
}
function plannedDebt(){
  return db.debts.filter(function(x){return !debtInfo(x).done;}).reduce(function(a,x){return a+(+x.monthly||0);},0);
}
function nextDue(day){
  var now=new Date(),y=now.getFullYear(),m=now.getMonth();
  function dim(yy,mm){return new Date(yy,mm+1,0).getDate();}
  var t0=new Date(y,m,now.getDate()), d=new Date(y,m,Math.min(day,dim(y,m)));
  if(d<t0){var ny=m===11?y+1:y,nm=(m+1)%12; d=new Date(ny,nm,Math.min(day,dim(ny,nm)));}
  return {date:d,days:Math.round((d-t0)/86400000)};
}
/* Khoản nợ nhập sau ngày trả của tháng này: coi như kỳ tháng này đã trả rồi */
function skipCycle(d){
  if(!d.dueDay||!d.created) return false;
  var c=new Date(d.created), now=new Date();
  if(c.getFullYear()!==now.getFullYear()||c.getMonth()!==now.getMonth()) return false;
  var dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  return c.getDate()>Math.min(d.dueDay,dim);
}
function dueInfo(d){
  if(!d.dueDay) return null;
  var paidThis=debtPaidInMonth(d.id,curMonth()),monthly=+d.monthly||0,now=new Date();
  var dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),day=Math.min(d.dueDay,dim);
  if(monthly>0&&paidThis>=monthly) return {cls:'ok',t:'Tháng này đã trả đủ'};
  if(monthly>0&&day<now.getDate()&&!skipCycle(d)) return {cls:'bad',t:'Quá hạn ngày '+day+', còn thiếu '+fmt(monthly-paidThis)};
  var n=nextDue(d.dueDay).days;
  return {cls:n<=3?'warn':'',t:n===0?'Hạn trả là hôm nay':'Hạn trả ngày '+d.dueDay+' (còn '+n+' ngày)'};
}
function payoff(remain,monthly,paidThis){
  if(!monthly||remain<=0) return null;
  var n=Math.ceil(remain/monthly), off=paidThis>=monthly?n:n-1;
  return {n:n,label:monthLabel(shiftMonth(curMonth(),off))};
}
function avg3(catId){
  var sum=0,n=0;
  for(var i=1;i<=3;i++){var v=sums(shiftMonth(ui.month,-i)).byCat[catId]||0; if(v>0){sum+=v;n++;}}
  return n?Math.round(sum/n/1000)*1000:0;
}
function daysSince(){return Math.floor((Date.now()-db.lastBackup)/864e5);}
function backupOverdue(){return db.tx.length>0&&(!db.lastBackup||Date.now()-db.lastBackup>7*864e5);}
/* Ngày bắt đầu áp dụng ngân sách: '' = tính cả tháng; ngày trong tháng = chỉ tính từ ngày đó; '9999-12-31' = tháng chưa áp dụng */
function bFrom(mk){
  var bs=db.budStart; if(!bs||bs<=mk+'-01') return '';
  return bs>mk+'-31'?'9999-12-31':bs;
}
function bsums(mk){
  var f=bFrom(mk), inc=0,out=0,byCat={};
  monthTx(mk).forEach(function(t){
    if(f&&t.date<f) return;
    if(t.type==='in') inc+=t.amount;
    else if(t.type==='out'){out+=t.amount; byCat[t.cat]=(byCat[t.cat]||0)+t.amount;}
  });
  return {inc:inc,out:out,byCat:byCat};
}
function budState(sp,lim){return sp>lim?'over':(sp>=lim*0.8?'warn':'');}

/* Tổng ngân sách = tiền đang có vào đầu tháng (cash + ví + bank), hoặc số người dùng tự đặt */
function baseFor(mk){
  if(db.baseOv[mk]>0) return {v:db.baseOv[mk],manual:true};
  var f=bFrom(mk), open=Math.max(0,totals(f&&f<'9999'?f:mk+'-01').have), inc=bsums(mk).inc;
  return {v:open+inc,open:open,inc:inc,manual:false};
}
function fundIn(a,mk){
  var s=0,f=bFrom(mk); monthTx(mk).forEach(function(t){if(t.type==='tf'&&t.to===a.id&&(!f||t.date>=f)) s+=t.amount;}); return s;
}
function reminders(){
  var r=[];
  db.accounts.forEach(function(a){
    if(!isLiab(a)||!a.dueDay) return;
    var owed=accVal(a); if(owed<=0) return;
    var n=nextDue(a.dueDay).days; if(n>5) return;
    r.push({cls:n<=2?'bad':'',t:a.name+': '+(n===0?'hôm nay là hạn thanh toán':'còn '+n+' ngày đến hạn thanh toán')+', dư nợ '+fmt(owed)});
  });
  db.debts.forEach(function(d){
    var i=debtInfo(d); if(i.done) return;
    var du=dueInfo(d); if(du&&(du.cls==='warn'||du.cls==='bad')) r.push({cls:du.cls==='bad'?'bad':'',t:d.name+': '+du.t});
  });
  return r.slice(0,4);
}

/* ================= Khoản lặp ================= */
function runRecurring(){
  var cm=curMonth(), td=new Date().getDate(), adds=[];
  db.rec.forEach(function(r){
    var m=shiftMonth(r.last,1), guard=0;
    while(m<=cm&&guard++<24){
      var dim=new Date(+m.slice(0,4),+m.slice(5),0).getDate(), day=Math.min(r.day,dim);
      if(m===cm&&day>td) break;
      var t={id:uid(),type:r.type,amount:r.amount,cat:r.cat,acc:r.acc,date:m+'-'+pad(day),note:r.note,ts:Date.now(),recId:r.id};
      if(r.debtId) t.debtId=r.debtId;
      adds.push(t); r.last=m; m=shiftMonth(m,1);
    }
  });
  if(adds.length){adds.forEach(function(t){db.tx.push(t);}); save();}
  return adds.length;
}

function donut(items,total){
  var R=52,C=2*Math.PI*R,acc=0,arcs='';
  items.forEach(function(it){
    var len=it[1]/total*C, gap=items.length>1?Math.min(2,len*0.2):0, L=Math.max(0,len-gap);
    arcs+='<circle cx="75" cy="75" r="'+R+'" class="arc" style="stroke:var(--c'+catOf(it[0]).c+')" stroke-dasharray="'+L.toFixed(2)+' '+(C-L).toFixed(2)+'" stroke-dashoffset="'+(-acc).toFixed(2)+'"/>';
    acc+=len;
  });
  return '<svg viewBox="0 0 150 150" class="donut" role="img" aria-label="Biểu đồ chi theo nhóm"><circle cx="75" cy="75" r="'+R+'" class="ring"/>'+arcs+'</svg>';
}

function histList(){
  var f=ui.hf, q=f.q.trim().toLowerCase();
  var rows=monthTx(ui.month).filter(function(t){
    if(f.type!=='all'&&t.type!==f.type) return false;
    if(f.cat!=='all'&&t.cat!==f.cat) return false;
    if(f.acc!=='all'&&t.acc!==f.acc&&t.to!==f.acc) return false;
    if(q){
      var name=t.type==='tf'?tfTitle(t):catOf(t.cat).n;
      if((t.note||'').toLowerCase().indexOf(q)<0&&name.toLowerCase().indexOf(q)<0) return false;
    }
    return true;
  }).sort(sortTx);
  if(!rows.length){
    var filtered=f.type!=='all'||f.cat!=='all'||f.acc!=='all'||q;
    return '<div class="card empty"><p>'+(filtered?'Không có khoản nào khớp.':'Tháng này chưa có khoản nào.')+'</p>'+(filtered?'':'<button class="btn pri" data-a="tab" data-t="add">Ghi khoản đầu tiên</button>')+'</div>';
  }
  var out='',cur='',buf=[];
  function flush(){
    if(!buf.length) return;
    var net=0,has=false;
    buf.forEach(function(t){if(t.type==='in'){net+=t.amount;has=true;} else if(t.type==='out'){net-=t.amount;has=true;}});
    out+='<div class="dgroup"><div class="dh"><span>'+dayLabel(cur)+'</span><span class="num">'+(has?(net<0?'−':'+')+fmtNum(net)+'đ':'')+'</span></div><div class="card list">'+buf.map(function(t){return txRow(t);}).join('')+'</div></div>';
    buf=[];
  }
  rows.forEach(function(t){if(t.date!==cur){flush();cur=t.date;} buf.push(t);});
  flush();
  return out;
}

function tfHint(d){
  var A=accOf(d.acc),B=accOf(d.to); if(!A||!B) return '';
  if(isLiab(B)) return 'Trả '+B.name+': giảm dư nợ, không tính là chi tiêu.';
  if(B.kind==='fund') return 'Góp quỹ: không tính là chi tiêu.';
  if(A.kind==='fund') return 'Rút quỹ về tài khoản, không tính là thu nhập.';
  if(isLiab(A)) return 'Rút tiền từ thẻ: dư nợ tăng.';

function draftMulti(d){return d.type==='out'&&d.cat==='debt'&&!d.id;}
function draftAmt(d){
  if(draftMulti(d)){var s=0; Object.keys(d.dpay||{}).forEach(function(k){s+=+d.dpay[k]||0;}); return s;}

function debtDefAmt(id){

function saveDebtPay(){

  mutate(function(){
    ids.forEach(function(k){
      var a=Math.round(d.dpay[k]);
      db.tx.push({id:uid(),type:'out',amount:a,date:date,note:note,ts:Date.now(),acc:d.acc,cat:'debt',debtId:k});

  if(lim){
    if(mode==='goal'){st='good'; msg=sp>=lim?'Đã đủ':'Còn cần '+fmt(lim-sp);}

    (lim?'<span class="bar '+st+'" style="display:block"><i style="width:'+pct.toFixed(1)+'%"></i></span><span class="st '+st+'">'+msg+'</span>':'<span class="muted small">'+(sub||'Chạm để đặt hạn mức')+'</span>')+
    (lim&&sub?'<span class="muted small" style="display:block">'+esc(sub)+'</span>':'')+'</span></button>';

  }else{
    G.fund.forEach(function(r){
      var bal=accVal(r.a), sub='Số dư '+fmt(bal)+(r.a.target?' · mục tiêu '+fmtNum(r.a.target)+'đ ('+Math.min(999,Math.round(bal/r.a.target*100))+'%)':'');

    });

/* ================= Định dạng gọn (TT2) cho sao lưu Sheet ================= */
/* Mỗi dòng 1 mục, ngăn bằng "|". H=đầu, A=tài khoản, D=nợ, B=ngân sách, G=nhóm, M=tổng NS, R=lặp,
   o/i/t = chi/thu/chuyển: loại|id|tk|tkĐến|nhóm|tiền|ngày|ghi chú|nợ|lặp|giờ(base36). E=số dòng để kiểm tra. */
function pEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/\|/g,'\\p').replace(/\r/g,'').replace(/\n/g,'\\n');}
function pUn(s){return s.replace(/\\(.)/g,function(m,c){return c==='p'?'|':(c==='n'?'\n':c);});}
function J(a){return a.map(function(v){return typeof v==='string'?pEsc(v):v;}).join('|');}
function pack(d){
  var ai={}; d.accounts.forEach(function(a,i){ai[a.id]=i;});
  var L=[J(['H',2,d.created.toString(36),ai[d.lastAcc]!=null?ai[d.lastAcc]:''])];
  d.accounts.forEach(function(a){L.push(J(['A',a.id,a.name,a.kind,a.open,a.limit,a.stmtDay,a.dueDay,a.target]));});
  d.debts.forEach(function(x){L.push(J(['D',x.id,x.name,x.note,x.total,x.prepaid,x.monthly,x.dueDay,(x.created||0).toString(36)]));});
  Object.keys(d.budgets).forEach(function(k){L.push(J(['B',k,d.budgets[k]]));});
  d.cats.forEach(function(c){L.push(J(['C',c.id,c.t,c.n,c.i,c.c,c.g]));});
  Object.keys(d.baseOv).forEach(function(k){L.push(J(['M',k,d.baseOv[k]]));});
  if(d.budStart) L.push(J(['S',d.budStart]));
  d.rec.forEach(function(r){L.push(J(['R',r.id,r.type,r.amount,r.cat,ai[r.acc],r.note,r.day,r.last,r.debtId]));});
  d.tx.forEach(function(t){
    L.push(J([t.type==='out'?'o':(t.type==='in'?'i':'t'),t.id,ai[t.acc],t.to?ai[t.to]:'',t.cat||'',t.amount,t.date.replace(/-/g,''),t.note||'',t.debtId||'',t.recId||'',Math.round((t.ts||0)/1000).toString(36)]));
  });
  L.push('E|'+L.length);
  return '#TT2 Tui Tien. H=dau A=tai khoan D=no B=ngan sach C=nhom(id|chi/thu|ten|icon|mau|dinh/bien phi) M=tong ngan sach R=lap lai; o=chi i=thu t=chuyen: loai|id|tk|tk_den|nhom|tien|ngay|ghichu|no|lap|gio36; E=so dong\n'+L.join('\n');
}
function unpack(text){
  var lines=String(text).split('\n'), n=0, endOk=false, lastIdx='';
  var d={accounts:[],tx:[],debts:[],budgets:{},bgroup:{},cats:[],baseOv:{},budStart:"",rec:[]};
  function idOf(i){var a=d.accounts[+i]; return a?a.id:'';}
  for(var li=0;li<lines.length;li++){
    var line=lines[li]; if(!line||line.charAt(0)==='#') continue;
    var f=line.split('|'), t=f[0];
    if(t==='E'){endOk=(+f[1]===n); break;}
    n++;
    for(var i=1;i<f.length;i++) f[i]=pUn(f[i]);
    if(t==='H'){d.created=parseInt(f[2],36)||0; lastIdx=f[3];}
    else if(t==='A') d.accounts.push({id:f[1],name:f[2],kind:f[3],open:+f[4],limit:+f[5],stmtDay:+f[6],dueDay:+f[7],target:+f[8]});
    else if(t==='D') d.debts.push({id:f[1],name:f[2],note:f[3],total:+f[4],prepaid:+f[5],monthly:+f[6],dueDay:+f[7],created:parseInt(f[8],36)||0});
    else if(t==='B') d.budgets[f[1]]=+f[2];
    else if(t==='G') d.bgroup[f[1]]=f[2];
    else if(t==='C') d.cats.push({id:f[1],t:f[2],n:f[3],i:f[4],c:+f[5],g:f[6]});
    else if(t==='M') d.baseOv[f[1]]=+f[2];
    else if(t==='S') d.budStart=f[1];
    else if(t==='R') d.rec.push({id:f[1],type:f[2],amount:+f[3],cat:f[4],acc:idOf(f[5]),note:f[6],day:+f[7],last:f[8],debtId:f[9]});
    else if(t==='o'||t==='i'||t==='t'){
      var x={id:f[1],type:t==='o'?'out':(t==='i'?'in':'tf'),acc:idOf(f[2]),amount:+f[5],date:f[6].replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3'),note:f[7],ts:(parseInt(f[10],36)||0)*1000};
      if(t==='t') x.to=idOf(f[3]); else{x.cat=f[4]; if(f[8]) x.debtId=f[8]; if(f[9]) x.recId=f[9];}
      d.tx.push(x);
    }
  }
  if(!endOk) return null;
  if(!d.cats.length) delete d.cats;
  d.lastAcc=idOf(lastIdx);
  return d;
}

function cfgSave(){try{localStorage.setItem(SK,JSON.stringify(cfg));}catch(e){}}
function hsh(s){var h=5381,i=s.length; while(i) h=(h*33)^s.charCodeAt(--i); return (h>>>0).toString(36)+'.'+s.length;}
function chunkText(s,n){var o=[]; for(var i=0;i<s.length;i+=n) o.push(s.slice(i,i+n)); return o;}
function hm(ts){var d=new Date(ts||Date.now()); return pad(d.getHours())+':'+pad(d.getMinutes());}
function whenTxt(ts){
  var n=Math.floor((Date.now()-ts)/864e5);
  return (new Date(ts).toDateString()===new Date().toDateString())?'hôm nay lúc '+hm(ts):(n<=1?'hôm qua':n+' ngày trước');
}
function readCfgInputs(){
  var u=$('#sUrl'); if(!u) return;
  var url=u.value.trim(); if(url!==cfg.url) cfg.h='';
  cfg.url=url; cfg.key=$('#sKey').value.trim(); cfg.auto=$('#sAuto').checked; cfgSave();
}
function cfgOk(){
  if(!cfg.url||cfg.url.indexOf('https://script.google.com/')!==0){toast('Dán link script (bắt đầu bằng https://script.google.com/)'); return false;}
  if(!cfg.key){toast('Nhập mã bí mật'); return false;}
  return true;
}
function updStat(){var el=$('#bkStat'); if(el) el.textContent=bkText();}
function sheetPush(manual){
  if(!cfg.url||!cfg.key||syncing) return Promise.resolve(false);
  var txt=pack(db), h=hsh(txt);
  if(h===cfg.h&&cfg.at&&!cfg.err){
    if(manual) toast('Dữ liệu chưa đổi, bản trên Sheet vẫn mới nhất');
    return Promise.resolve(true);
  }
  syncing=true;
  var ctl=window.AbortController?new AbortController():null, to=setTimeout(function(){if(ctl) ctl.abort();},25000);
  return fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:cfg.key,c:chunkText(txt,40000)}),signal:ctl?ctl.signal:undefined})
    .then(function(r){return r.text();})
    .then(function(t){
      t=t.trim();
      if(t!=='ok') throw new Error(t==='sai ma'?'Sai mã bí mật':'Link chưa đúng, hoặc chưa cho phép “Bất kỳ ai”');
      cfg.h=h; cfg.at=Date.now(); cfg.err=''; cfgSave();
      db.lastBackup=Date.now(); save();
      if(manual) toast('Đã sao lưu lên Sheet lúc '+hm());
      return true;
    })
    .catch(function(e){
      cfg.err=(e&&e.name==='AbortError')?'Quá thời gian chờ':((e&&/^(Sai|Link)/.test(e.message))?e.message:'Không kết nối được, kiểm tra mạng');
      cfgSave(); if(manual) toast('Sao lưu lỗi: '+cfg.err); return false;
    })
    .then(function(r){clearTimeout(to); syncing=false; updStat(); if(ui.tab==='home') render(); return r;});
}
function schedAuto(){
  if(!cfg||!cfg.auto||!cfg.url||!cfg.key) return;
  clearTimeout(autoT);
  autoT=setTimeout(function(){if(navigator.onLine!==false) sheetPush(false);},4000);
}
function sheetPull(){
  readCfgInputs(); if(!cfgOk()) return;
  toast('Đang lấy dữ liệu từ Sheet...');
  fetch(cfg.url+'?k='+encodeURIComponent(cfg.key)).then(function(r){return r.text();}).then(function(t){

}

function backupObj(){return {app:'tui-tien',version:2,exportedAt:new Date().toISOString(),data:db};}
function bkText(){
  if(cfg.url&&cfg.key){
    if(cfg.err) return 'Sao lưu Sheet lỗi: '+cfg.err;
    return cfg.at?'Đã sao lưu lên Sheet '+whenTxt(cfg.at)+'.':'Chưa sao lưu lên Sheet lần nào.';
  }
  if(!db.lastBackup) return 'Chưa sao lưu lần nào.';
  var n=daysSince(); return 'Sao lưu lần cuối: '+(n===0?'hôm nay':n+' ngày trước')+'.';
}
function refreshBk(){var el=$('#bkStat'); if(el) el.textContent=bkText(); if(ui.tab==='home') render();}
function saveFile(name,mime,text){
  var file;
  try{file=new File([text],name,{type:mime});}catch(e){return Promise.resolve('fail');}
  var p=Promise.resolve('');
  if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
    p=navigator.share({files:[file],title:name}).then(function(){return 'shared';},function(e){return e&&e.name==='AbortError'?'cancel':'';});
  }
  return p.then(function(r){
    if(r) return r;
    try{
      var url=URL.createObjectURL(file), a=document.createElement('a');
      a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},4000);
      return 'download';
    }catch(e){return 'fail';}
  });
}
function doBackup(){
  return saveFile('tui-tien-'+today()+'.json','application/json',JSON.stringify(backupObj())).then(function(r){
    if(r==='cancel') return;
    if(r==='fail') return toast('Không tạo được file. Dùng “Sao chép dữ liệu”.');
    db.lastBackup=Date.now(); save();
    toast(r==='shared'?'Chọn “Lưu vào Tệp” để giữ file sao lưu.':'Đã tải file sao lưu.');
    refreshBk();
  });
}
function doCopy(){
  var txt=JSON.stringify(backupObj());
  function fallback(){
    var ta=$('#rText'); if(ta){ta.value=txt; ta.focus(); ta.select();}
    toast('Hãy chọn tất cả rồi sao chép nội dung trong ô.');
  }
  if(!navigator.clipboard||!navigator.clipboard.writeText) return fallback();
  navigator.clipboard.writeText(txt).then(function(){
    db.lastBackup=Date.now(); save(); toast('Đã sao chép. Dán vào Ghi chú để cất.'); refreshBk();
  },fallback);
}
function parseBackup(text){
  var tt=String(text).trim();
  if(tt.indexOf('#TT2')===0){var u=unpack(tt); return u?{data:norm(u),at:''}:{err:'Bản sao lưu bị thiếu hoặc hỏng.'};}
  var o; try{o=JSON.parse(tt);}catch(e){return {err:'Nội dung này không phải bản sao lưu hợp lệ.'};}
  var d=o&&o.data?o.data:o;
  if(!d||!Array.isArray(d.tx)) return {err:'Không thấy dữ liệu Túi Tiền trong nội dung này.'};
  return {data:norm(d),at:o&&o.exportedAt||''};
}
function previewRestore(text){
  var box=$('#rBox'); if(!box){openData(); box=$('#rBox');}
  var r=parseBackup(text);
  if(r.err){ui.pending=null; box.innerHTML='<div class="banner bad">'+esc(r.err)+'</div>'; return;}

  box.innerHTML='<div class="card flat stack"><p><b>'+x.tx.length+'</b> giao dịch, <b>'+x.accounts.length+'</b> tài khoản, <b>'+x.debts.length+'</b> khoản nợ'+(r.at?' · sao lưu '+new Date(r.at).toLocaleDateString('vi-VN'):'')+'</p>'+
    '<p class="muted small">Hiện có: '+db.tx.length+' giao dịch, '+db.accounts.length+' tài khoản, '+db.debts.length+' khoản nợ.</p>'+

}
function mergeData(a,b){
  var ids={}; a.tx.forEach(function(t){ids[t.id]=1;}); b.tx.forEach(function(t){if(!ids[t.id]) a.tx.push(t);});
  var dids={}; a.debts.forEach(function(d){dids[d.id]=1;}); b.debts.forEach(function(d){if(!dids[d.id]) a.debts.push(d);});
  var aids={}; a.accounts.forEach(function(x){aids[x.id]=1;}); b.accounts.forEach(function(x){if(!aids[x.id]) a.accounts.push(x);});
  var cids={}; a.cats.forEach(function(c){cids[c.id]=1;}); b.cats.forEach(function(c){if(!cids[c.id]) a.cats.push(c);});
  var rids={}; a.rec.forEach(function(r){rids[r.id]=1;}); b.rec.forEach(function(r){if(!rids[r.id]) a.rec.push(r);});
  Object.keys(b.budgets).forEach(function(k){if(!(k in a.budgets)) a.budgets[k]=b.budgets[k];});
}

  try{

}

document.addEventListener('click',function(e){

    case 'tab':{
      var t=el.dataset.t;
      if(t==='add'&&ui.tab!=='add'){ui.draft=newDraft(ui.draft.type); ui.returnTab=null;}
      else if(t!=='add'){if(ui.draft.id) ui.draft=newDraft('out'); ui.returnTab=null;}

      var v=el.dataset.v;

        ui.draft.type=v; ui.draft.debtId='';

  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='hq'){ui.hf.q=t.value; $('#hlist').innerHTML=histList();}
  else if(t.id==='fNote') ui.draft.note=t.value;
  else if(t.id&&t.id.indexOf('dp_')===0){
    var nv=parseInt(t.value.replace(/\D/g,'').slice(0,12)||'0',10); t.value=nv?fmtNum(nv):'';
    ui.draft.dpay[t.id.slice(3)]=nv; updAmt();
  }
  else if(t.id==='fDate') ui.draft.date=t.value;
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='hcat'){ui.hf.cat=t.value; $('#hlist').innerHTML=histList();}
  else if(t.id==='hacc'){ui.hf.acc=t.value; $('#hlist').innerHTML=histList();}
  else if(t.id==='fDebt') ui.draft.debtId=t.value;
  else if(t.id==='fDate') ui.draft.date=t.value;
  else if(t.id==='fRep') ui.draft.repeat=t.checked;
  else if(t.id==='fAcc'){ui.draft.acc=t.value; if(ui.draft.type==='tf') ensureTo(ui.draft); render();}
  else if(t.id==='fTo'){ui.draft.to=t.value; render();}
  else if(t.id==='aKind') syncAcc();
  else if(t.id==='sUrl'||t.id==='sKey'||t.id==='sAuto'){readCfgInputs(); schedAuto(); updStat();}
  else if(t.id==='fileIn'){
    var f=t.files&&t.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){previewRestore(String(rd.result));};
    rd.readAsText(f); t.value='';
  }
});

/* ================= Khởi động ================= */
function makeIcon(){
  try{
    var c=document.createElement('canvas'); c.width=c.height=180; var x=c.getContext('2d');
    function rr(px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}
    x.fillStyle='#3347E0'; x.fillRect(0,0,180,180);
    x.fillStyle='rgba(255,255,255,.55)'; rr(46,40,70,30,10); x.fill();
    x.fillStyle='#fff'; rr(34,56,112,82,22); x.fill();
    x.fillStyle='#3347E0'; rr(94,86,54,26,13); x.fill();
    x.fillStyle='#fff'; x.beginPath(); x.arc(110,99,5.5,0,Math.PI*2); x.fill();
    var url=c.toDataURL('image/png');
    ['apple-touch-icon','icon'].forEach(function(rel){var l=document.createElement('link'); l.rel=rel; l.href=url; document.head.appendChild(l);});
  }catch(e){}
}
function init(){
  try{localStorage.setItem('__t','1'); localStorage.removeItem('__t'); storageOk=true;}catch(e){storageOk=false;}
  db=load();
  save();
  var added=runRecurring();
  ui.draft=newDraft('out');
  try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();}catch(e){}
  makeIcon();
  render();
  if(added) toast('Đã tự thêm '+added+' khoản lặp');
  schedAuto();
  window.addEventListener('online',schedAuto);
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden){
      schedAuto();
      var n=runRecurring();
      if(n){render(); toast('Đã tự thêm '+n+' khoản lặp');}
    }
  });
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
}
init();
})();
</script>
